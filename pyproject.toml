[project]
name = "faro-analytics"
version = "0.1.0"
description = "Faro - Plataforma de Analitica Inteligente de Ventas"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# ---------- Calidad de código ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores y estilo básico · I: orden de imports · UP: sintaxis moderna · B: bugs comunes
select = ["E", "F", "I", "UP", "B"]

# ---------- Pruebas ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["database/scripts"]
markers = [
    "integracion: pruebas que necesitan una base PostgreSQL disponible",
]
