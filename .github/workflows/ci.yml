# Integración continua (CI) de Faro.
# Se ejecuta en cada push a main y en cada Pull Request.
# Si algún job falla, el cambio NO debe integrarse a main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llegan dos ejecuciones para la misma rama, se cancela la anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el pipeline solo puede leer el repositorio
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad de código (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Instalar dependencias exactas (uv.lock)
        run: uv sync --locked
      - name: Lint (errores y malas prácticas)
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      # Vercel instala la API desde backend/requirements.txt: debe ser idéntico a uv.lock.
      # Si falla, regenerarlo con el comando de abajo (sin -o /tmp/...) y subirlo.
      - name: Dependencias de la API para Vercel al día con uv.lock
        run: |
          uv export --frozen --format requirements.txt --no-dev --no-hashes --no-emit-project \
            --no-header --no-annotate -o /tmp/requirements.txt
          diff -u backend/requirements.txt /tmp/requirements.txt

  pruebas:
    name: Pruebas (pytest + PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # misma versión mayor que Neon (producción)
        env:
          POSTGRES_USER: admin
          # Contraseña desechable: esta base solo existe mientras corre el job
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wwi_oltp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d wwi_oltp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SOURCE_DATABASE_URL: postgresql://admin:ci_password@localhost:5432/wwi_oltp
      ANALYTICS_DATABASE_URL: postgresql://admin:ci_password@localhost:5432/faro_analytics
    steps:
      - uses: actions/checkout@v7
      - name: Crear bases (mismo script que usa Docker en local)
        run: psql "$SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/scripts/local-init/01_create_databases.sql
      - uses: astral-sh/setup-uv@v10.3.3
      # Mismas dependencias que el CD: si una prueba necesitara el grupo "seed"
      # (conector de SQL Server), debe fallar aquí y no en producción.
      - name: Instalar dependencias exactas (uv.lock)
        run: uv sync --locked
      - name: Ejecutar pruebas
        run: uv run pytest -v

  dashboard:
    name: Dashboard (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias exactas (package-lock.json)
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas unitarias (Vitest)
        run: npm test
      # Compila TypeScript en modo estricto y genera el sitio estático que se publica
      - name: Build
        run: npm run build
      # La prueba E2E (Playwright) necesita la base con datos completos: se corre en local
      # con "npm run e2e" y sus capturas quedan en documentation/capturas.

  docker-compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar sintaxis y variables
        env:
          POSTGRES_PASSWORD: solo_para_validar
          MSSQL_SA_PASSWORD: Solo_Para_Validar_1
        run: |
          docker compose config --quiet
          docker compose -f database/source/seed/docker-compose.seed.yml config --quiet
