# Pipeline de ventas en producción (Neon): staging + Data Warehouse.
#
# Ejecuta: fuente (wwi_oltp) -> staging (raw, clean, cuarentena, ready) -> dw, con
# auditoría, y después valida el DW (11 controles de reconciliación y modelo).
# El runner arranca, carga y se apaga: no hay servidor encendido (ver decisión D-13).
#
# Corre cada hora (latencia acordada: <= 1 hora, decisión D-17) y también a mano:
# Actions -> ETL - Ventas -> Run workflow.
#
# Usa roles de mínimo privilegio: etl_lector (solo lee la fuente) y faro_etl (solo datos
# de staging y auditoría). No usa las credenciales del dueño de las bases.

name: ETL - Ventas

on:
  schedule:
    - cron: "7 * * * *" # minuto 7 de cada hora (UTC); GitHub puede retrasarlo unos minutos
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental = solo cambios · inicial = vacía staging y recarga todo"
        type: choice
        options: [incremental, inicial]
        default: incremental

# Nunca dos ejecuciones a la vez (además del candado en la base)
concurrency:
  group: etl-ventas-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Ventas → staging → DW (${{ inputs.modo || 'incremental' }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_ETL_SOURCE_URL }}
      ANALYTICS_DATABASE_URL: ${{ secrets.NEON_ETL_ANALYTICS_URL }}
      # En las ejecuciones programadas no hay entradas: incremental y disparador cron
      MODO: ${{ inputs.modo || 'incremental' }}
      DISPARADOR: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Instalar dependencias exactas (uv.lock)
        run: uv sync --locked

      - name: Ejecutar pipeline
        run: uv run python -m etl.orchestration.pipeline --modo "$MODO" --disparador "$DISPARADOR"

      - name: Validar el Data Warehouse (reconciliación y modelo)
        run: uv run python database/scripts/validar_dw.py

      # Fase 7: con los datos ya cargados y validados, evaluar las alertas y notificar (rol
      # faro_alertas). Repetir la evaluación no duplica alertas ni correos.
      - name: Evaluar alertas y notificar
        env:
          ALERTAS_DATABASE_URL: ${{ secrets.NEON_ALERTAS_ANALYTICS_URL }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERTAS_DESTINO: ${{ secrets.ALERTAS_DESTINO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m notifications evaluar --disparador "$DISPARADOR"

      - name: Resultado de la validación
        if: always()
        run: |
          if [ -f documentation/pruebas/validacion-dw-neon.md ]; then
            sed "1s/^# /## /" documentation/pruebas/validacion-dw-neon.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resumen de la ejecución (desde la auditoría)
        if: always()
        run: |
          {
            echo "## ETL - Ventas (staging + DW) · última ejecución"
            echo ""
            echo "| Ejecución | Modo | Estado | Leídas | Nuevas | Actualizadas | Rechazadas | Sin cambios | Reconciliado | Segundos |"
            echo "|---|---|---|---:|---:|---:|---:|---:|---|---:|"
            psql "$ANALYTICS_DATABASE_URL" -At -F ' | ' -c "
              SELECT execution_id, mode, status, rows_read, rows_inserted, rows_updated,
                     rows_rejected, rows_unchanged, coalesce(reconciled::text, '-'),
                     round(extract(epoch FROM end_time - start_time))
              FROM audit.etl_execution ORDER BY execution_id DESC LIMIT 1" | sed 's/^/| /; s/$/ |/'
            echo ""
            echo "### Reglas de calidad con casos"
            echo ""
            echo "| Tabla | Regla | Acción | Evaluadas | Fallaron |"
            echo "|---|---|---|---:|---:|"
            psql "$ANALYTICS_DATABASE_URL" -At -F ' | ' -c "
              SELECT source_table, rule_code, action, rows_checked, rows_failed
              FROM audit.dq_result
              WHERE execution_id = (SELECT max(execution_id) FROM audit.etl_execution)
                AND rows_failed > 0 ORDER BY 1, 2" | sed 's/^/| /; s/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"
